<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ResQ – Use Case Diagram</title>
<style>
@page{size:A4 portrait;margin:6mm}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#1d2433}
h1{text-align:center;font-size:17pt;margin:2px 0 0;color:#0f1b33}
.sub{text-align:center;color:#b0213f;font-weight:600;font-size:9.5pt;margin-bottom:2px}
svg{display:block;margin:0 auto;width:100%;height:auto}
</style></head><body>
<h1>ResQ – Use Case Diagram</h1>
<div class="sub">رسمة حالات الاستخدام · AI-Powered Emergency Assistance &amp; Community Response Platform</div>
<svg id="d" viewBox="0 0 1100 930" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const s=document.getElementById('d'),NS='http://www.w3.org/2000/svg';
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;s.appendChild(e);return e;}
const LX=410,RX=690,CX=550,RXR=125,RY=25;
const C={c:'#4a90e2',a:'#d1495b',t:'#2a9d6f',x:'#8a5cd6'};
// system boundary
el('rect',{x:262,y:52,width:576,height:868,rx:14,fill:'#fbfcff',stroke:'#0f1b33','stroke-width':2});
el('text',{x:550,y:76,'text-anchor':'middle','font-size':15,'font-weight':800,fill:'#0f1b33'},'ResQ System  ·  نظام ResQ');
const uc=[], add=(id,x,y,en,ar,col)=>uc.push({id,x,y,en,ar,col});
add('login',CX,110,'Register / Log in','التسجيل / الدخول','#555');
[['submit','Submit Incident','إرسال بلاغ'],['photos','Upload Incident Photos','رفع صور البلاغ'],['map','Select Location on Map','تحديد الموقع على الخريطة'],['track','Track My Reports','متابعة بلاغاتي'],['editown','Edit / Cancel Own Report','تعديل / إلغاء بلاغي']]
 .forEach((u,i)=>add(u[0],LX,180+i*60,u[1],u[2],C.c));
[['assigned','View Assigned Incidents','عرض المهام المعيّنة'],['ack','Acknowledge Assignment','تأكيد استلام المهمة'],['progress','Update Progress & Notes','تحديث التقدم والملاحظات'],['resphotos','Upload Resolution Photos','رفع صور الإصلاح'],['complete','Mark as Completed','إعلان انتهاء المهمة']]
 .forEach((u,i)=>add(u[0],LX,520+i*60,u[1],u[2],C.t));
[['review','Review Incidents','مراجعة البلاغات'],['viewai','View AI Analysis','عرض تحليل الذكاء الاصطناعي'],['approve','Approve / Reject Incident','قبول / رفض البلاغ'],['priority','Change Priority','تغيير الأهمية'],['assign','Assign Response Team','تعيين فريق'],['dups','Review Duplicates','مراجعة البلاغات المكررة'],['manage','Manage Teams & Categories','إدارة الفرق والأقسام'],['users','Manage Users','إدارة المستخدمين'],['close','Close Incident','إغلاق البلاغ'],['dash','View Dashboard & Reports','لوحة التحكم والتقارير'],['logs','View Audit Logs','عرض سجل العمليات']]
 .forEach((u,i)=>add(u[0],RX,170+i*56,u[1],u[2],C.a));
add('ai',RX,800,'Analyze Incident (AI)','تحليل البلاغ بالذكاء الاصطناعي',C.x);
add('notify',CX,872,'Receive Notifications','استلام الإشعارات','#555');
const U=id=>uc.find(u=>u.id==id);
// actors
const actors={citizen:{x:120,y:240,en:'Citizen',ar:'المواطن',col:C.c},team:{x:120,y:640,en:'Response Team',ar:'فريق الإصلاح',col:C.t},
 admin:{x:985,y:420,en:'Administrator',ar:'المدير',col:C.a},aisvc:{x:985,y:745,en:'AI Service',ar:'الذكاء الاصطناعي',col:C.x,sys:1},email:{x:985,y:872,en:'Email Service',ar:'خدمة الإيميل',col:'#7a7f99',sys:1}};
function line(ax,ay,u,side,col,dash){const x=side=='L'?u.x-RXR:u.x+RXR;el('line',{x1:ax,y1:ay,x2:x,y2:u.y,stroke:col,'stroke-width':1.3,'stroke-dasharray':dash||'',opacity:.75});}
const links={citizen:['login','submit','photos','map','track','editown','notify'],team:['login','assigned','ack','progress','resphotos','complete','notify'],
 admin:['login','review','viewai','approve','priority','assign','dups','manage','users','close','dash','logs','notify'],aisvc:['ai'],email:['notify']};
for(const k in links){const a=actors[k];const left=a.x<550;links[k].forEach(id=>line(left?a.x+22:a.x-22,a.y,U(id),left?'L':'R',a.col));}
// include
const sb=U('submit'),ai=U('ai');
el('line',{x1:sb.x+60,y1:sb.y+22,x2:ai.x-60,y2:ai.y-22,stroke:C.x,'stroke-width':1.5,'stroke-dasharray':'6 4','marker-end':'url(#ar)'});
const defs=document.createElementNS(NS,'defs');defs.innerHTML='<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5cd6"/></marker>';s.insertBefore(defs,s.firstChild);
el('text',{x:(sb.x+ai.x)/2+14,y:(sb.y+ai.y)/2-4,'font-size':11,'font-style':'italic',fill:C.x,'font-weight':700},'«include»');
// draw use cases on top
uc.forEach(u=>{el('ellipse',{cx:u.x,cy:u.y,rx:RXR,ry:RY,fill:'#fff',stroke:u.col,'stroke-width':1.8});
 el('text',{x:u.x,y:u.y-3,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#1d2433'},u.en);
 el('text',{x:u.x,y:u.y+13,'text-anchor':'middle','font-size':10.5,fill:'#555',direction:'rtl'},u.ar);});
// actor figures
for(const k in actors){const a=actors[k],x=a.x,y=a.y;
 if(a.sys){el('rect',{x:x-50,y:y-24,width:100,height:48,rx:8,fill:'#fff',stroke:a.col,'stroke-width':2});
  el('text',{x:x,y:y-6,'text-anchor':'middle','font-size':9,fill:a.col},'«system»');
  el('text',{x:x,y:y+10,'text-anchor':'middle','font-size':11.5,'font-weight':800,fill:'#1d2433'},a.en);
  el('text',{x:x,y:y+40,'text-anchor':'middle','font-size':11,fill:'#555',direction:'rtl'},a.ar);continue;}
 el('circle',{cx:x,cy:y-38,r:11,fill:'#fff',stroke:a.col,'stroke-width':2.2});
 el('line',{x1:x,y1:y-27,x2:x,y2:y+5,stroke:a.col,'stroke-width':2.2});
 el('line',{x1:x-17,y1:y-16,x2:x+17,y2:y-16,stroke:a.col,'stroke-width':2.2});
 el('line',{x1:x,y1:y+5,x2:x-14,y2:y+27,stroke:a.col,'stroke-width':2.2});
 el('line',{x1:x,y1:y+5,x2:x+14,y2:y+27,stroke:a.col,'stroke-width':2.2});
 el('text',{x:x,y:y+46,'text-anchor':'middle','font-size':13,'font-weight':800,fill:'#1d2433'},a.en);
 el('text',{x:x,y:y+62,'text-anchor':'middle','font-size':11.5,fill:'#555',direction:'rtl'},a.ar);}
</script>
</body></html>
